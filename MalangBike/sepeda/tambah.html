<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MalangBike | Tambah Sepeda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container"><a class="navbar-brand fw-bold" href="../index.html">🚲 Malang<span>Bike</span></a>
            <div class="navbar-nav ms-auto"><a class="nav-link" href="list.html">← Kembali ke Sepeda</a></div>
        </div>
    </nav>
    <header class="page-hero">
        <div class="container"><span class="badge-hero">＋ DATA BARU</span>
            <h1>Tambah Sepeda</h1>
            <p>Masukkan data sepeda yang akan tersedia untuk disewa.</p>
        </div>
    </header>
    <section class="section-padding">
        <div class="container">
            <div class="form-box">
                <form id="bikeForm">
                    <div class="mb-3"><label>Nama Sepeda</label><input id="name" class="form-control" required
                            placeholder="Contoh: City Bike Premium"></div>
                    <div class="mb-3"><label>Jenis Sepeda</label><select id="type" class="form-select">
                            <option>City Bike</option>
                            <option>Mountain Bike</option>
                            <option>Electric Bike</option>
                        </select></div>
                    <div class="mb-3"><label>Harga Sewa per Jam</label><input id="price" type="number" min="0"
                            class="form-control" required placeholder="15000"></div>
                    <div class="mb-3"><label>Deskripsi</label><textarea id="description" class="form-control" rows="4"
                            required placeholder="Deskripsi sepeda"></textarea></div><button class="btn btn-main">Simpan
                        Sepeda</button>
                </form>
            </div>
        </div>
    </section>
    <script src="../assets/js/data.js"></script>
</body>

</html>
