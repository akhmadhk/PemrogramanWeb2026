<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MalangBike | Tambah Lokasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container"><a class="navbar-brand fw-bold" href="../index.html">🚲 Malang<span>Bike</span></a>
            <div class="navbar-nav ms-auto"><a class="nav-link" href="list.html">← Kembali ke Lokasi</a></div>
        </div>
    </nav>
    <header class="page-hero">
        <div class="container"><span class="badge-hero">＋ DATA BARU</span>
            <h1>Tambah Lokasi</h1>
            <p>Masukkan lokasi baru untuk titik penyewaan MalangBike.</p>
        </div>
    </header>
    <section class="section-padding">
        <div class="container">
            <div class="form-box">
                <form id="locationForm">
                    <div class="mb-3"><label>Nama Lokasi</label><input id="name" class="form-control" required
                            placeholder="Contoh: Stasiun Malang"></div>
                    <div class="mb-3"><label>Keterangan Area</label><input id="area" class="form-control" required
                            placeholder="Contoh: Malang Kota"></div>
                    <div class="mb-3"><label>Alamat</label><textarea id="address" class="form-control" rows="3"
                            placeholder="Alamat lengkap lokasi"></textarea></div><button class="btn btn-main">Simpan
                        Lokasi</button>
                </form>
            </div>
        </div>
    </section>
    <script src="../assets/js/data.js"></script>
</body>

</html>
