<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MalangBike | Tambah Lokasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="../index.html">🚲 MalangBike</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <nav class="collapse navbar-collapse" id="navMenu"><ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="../sepeda/list.html">Sepeda</a></li>
        <li class="nav-item"><a class="nav-link active" href="list.html">Lokasi</a></li>
      </ul></nav>
    </div>
  </header>

  <main class="container my-4">
    <section class="card shadow-sm mb-4 form-card">
      <div class="card-body">
        <h2 class="card-title mb-1">Tambah Lokasi</h2>
        <p class="text-secondary mb-4">Isi data lokasi penyewaan yang akan ditambahkan.</p>
        <form id="locationForm">
          <div class="mb-3"><label for="locationName" class="form-label fw-semibold">Nama Lokasi</label><input type="text" class="form-control" id="locationName" placeholder="Contoh: Alun-Alun Malang" required></div>
          <div class="mb-3"><label for="area" class="form-label fw-semibold">Area</label><input type="text" class="form-control" id="area" placeholder="Contoh: Klojen" required></div>
          <div class="mb-4"><label for="address" class="form-label fw-semibold">Alamat</label><textarea class="form-control" id="address" rows="3" placeholder="Alamat lengkap lokasi" required></textarea></div>
          <div class="d-flex gap-2"><button type="submit" class="btn btn-main">Simpan</button><a href="list.html" class="btn btn-outline-secondary">Batal</a></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="text-center text-secondary py-3 small"><p class="mb-0">&copy; 2026 MalangBike &mdash; Sistem Penyewaan Sepeda</p></footer>
  <script src="../assets/js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
